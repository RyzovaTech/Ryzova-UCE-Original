        <h1>Universal Compatibility Engine (UCE)</h1>
        <p>UCE is an open-source, local-first software compatibility checker for Git repositories and project archives. It helps developers identify runtime, dependency, framework, configuration, and project-structure compatibility risks before deployment.</p>
        <h2>Analyze a Project</h2>
        <p>Analyze a ZIP archive or a public GitHub repository in your browser. UCE detects project structure, languages, frameworks, runtimes, package managers, dependencies, lockfiles, configuration, and compatibility risks, then produces an engineering compatibility report.</p>
        <h2>How UCE Helps</h2>
        <p>UCE uses deterministic compatibility checks rather than AI-generated guesses. It is designed for developers, indie hackers, software teams, and open-source maintainers who want a clear view of project health before debugging or deployment.</p>
