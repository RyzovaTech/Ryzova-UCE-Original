        <h1>Ryzova UCE — Universal Compatibility Engine</h1>
        <p>
          Ryzova UCE is an open-source, local-first software compatibility checker from Ryzova for
          Git repositories and project archives. It helps developers identify runtime, dependency,
          framework, configuration, and project-structure compatibility risks before deployment.
        </p>
        <h2>Analyze a Project</h2>
        <p>
          Analyze a ZIP archive or a public GitHub repository in your browser. UCE detects project
          structure, programming languages, frameworks, runtimes, package managers, dependencies,
          lockfiles, build tools, configuration, and compatibility risks. The analyzer turns these
          observations into a clear engineering report so developers can investigate problems before
          they become build or deployment blockers.
        </p>
        <h2>How UCE Helps Developers</h2>
        <p>
          UCE uses deterministic compatibility checks rather than AI-generated guesses. It can
          identify common issues such as incompatible runtime versions, outdated dependency majors,
          missing lockfiles, duplicate dependency ranges, environment configuration gaps, and
          project structure concerns. The result is intended to give developers a practical starting
          point for debugging and maintenance.
        </p>
        <h2>UCE Detection Coverage</h2>
        <p>
          The current version of UCE recognizes 77 programming and source-language labels, including
          TypeScript, JavaScript, Python, Java, Go, Rust, C++, C#, Kotlin, Swift, PHP, Ruby, HTML, CSS,
          SQL, GraphQL, Bash and PowerShell. Its technology registry contains 639 detection definitions
          consolidated into 524 unique named technology profiles.
        </p>
        <p>
          Technology coverage includes 43 framework definitions such as React, Next.js, Vue, Angular,
          SvelteKit, Express, Django, FastAPI, Spring Boot, Laravel and Flutter; 37 runtime definitions
          including Node.js, Bun, Deno, Python, JVM, Go, Rust and .NET; 76 database definitions including
          PostgreSQL, MySQL, SQLite, MongoDB, Redis, DynamoDB, Elasticsearch and Supabase; 78 build-tool
          definitions including Vite, Webpack, Rollup, esbuild, Maven, Gradle, Cargo and CMake; 40
          package-manager definitions; 150 library definitions; and 94 testing-tool definitions.
        </p>
        <p>
          UCE also includes 105 browser compatibility rules, 40 security rules across 13 categories,
          22 architecture patterns, and 21 intelligence capabilities for code, dependencies,
          runtimes, platforms, builds, tests, performance, accessibility, APIs, databases,
          environments, deployment, licenses, documentation, maintainability, and repository health.
        </p>
        <h2>Built for Software Projects</h2>
        <p>
          UCE supports a broad range of common software stacks and is useful for individual
          developers, indie hackers, software teams, and open-source maintainers. The goal is
          simple: provide an understandable compatibility baseline before development gets blocked.
          Reports focus on detected technology, severity, impact, and recommended next steps rather
          than marketing claims.
        </p>
        <h2>Local-First and Open Source</h2>
        <p>
          ZIP project archives are analyzed locally in the browser. Public Git repositories are
          fetched only when you explicitly provide a remote repository for analysis. UCE is released
          as open source under the Mozilla Public License 2.0 (MPL 2.0), so developers can inspect the implementation,
          report issues, contribute improvements, and understand how compatibility checks are
          performed.
        </p>
