name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and lint
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Knowledge regression tests
        run: npm test

      - name: All V3 rule execution fixtures
        run: npm run test:v3-fixtures

      - name: JSON schema, accessibility, and trust gates
        run: npm run validate:schema

      - name: Performance benchmark
        run: npm run benchmark

      - name: V3 sampled-project memory benchmark
        run: npm run benchmark:v3-memory

      - name: Dependency security audit
        run: npm audit --omit=dev

      - name: UCE repository self-scan
        run: npm run security:self-scan

      - name: UCE pull request annotations
        if: github.event_name == 'pull_request'
        run: npm run uce:ci -- uce-self-scan.json --min-score=80 --max-critical=0 --max-warning=80 --annotations

      - name: UCE CI report gate
        run: npm run uce:ci -- testing/fixtures/phase5/ci-pass-report.json --min-score=80 --max-critical=0 --sarif=uce-ci-results.sarif

      - name: Upload UCE SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: uce-self-scan.sarif

      - name: Upload UCE reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uce-analysis-reports
          path: |
            uce-self-scan.json
            uce-self-scan.sarif
            uce-ci-results.sarif
