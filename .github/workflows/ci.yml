name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and lint
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Knowledge regression tests
        run: npm test

      - name: UCE CI report gate
        run: npm run uce:ci -- testing/fixtures/phase5/ci-pass-report.json --min-score=80 --max-critical=0 --sarif=uce-ci-results.sarif

      - name: Upload UCE SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: uce-ci-results.sarif
