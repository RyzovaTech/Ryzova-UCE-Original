name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and lint
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Evidence benchmark contracts
        run: npm run test:benchmark && node testing/benchmark/run.mjs --check --output=uce-evidence-benchmark.json

      - name: Knowledge regression tests
        run: npm test

      - name: Batch report and native symbol regression tests
        run: npm run test:report-regressions

      - name: Structured declaration and AST evidence regression tests
        run: npm run test:evidence

      - name: Security false-positive contracts and context checks
        run: npm run audit:accuracy:security && npm run test:security-context

      - name: Provisional security and browser compatibility evidence metrics
        run: node testing/accuracy/evidence-evaluation.mjs

      - name: Package-local version and configuration correlation contracts
        run: npm run test:correlation && npm run audit:accuracy:correlation

      - name: Bounded accuracy regression audit
        run: npm run audit:accuracy

      - name: Development accuracy baseline regression gate
        run: npm run audit:accuracy:baseline

      - name: Accuracy metric contracts and scope regression gate
        run: npm run test:accuracy-metrics && npm run audit:accuracy:scopes

      - name: Pinned manifest evaluation regression gate
        run: npm run audit:accuracy:holdout

      - name: Accuracy release validation and claim boundaries
        run: npm run test:release-validation && node testing/release/run.mjs --output=uce-accuracy-release.json

      - name: All V3 rule execution fixtures
        run: npm run test:v3-fixtures

      - name: Real AST detector regression tests
        run: npm run test:v3-ast

      - name: Symbolic runtime, dependency and configuration contracts
        run: npm run test:symbolic

      - name: Install isolated Z3 PoC solver dependencies
        run: npm install --prefix experiments/z3-node --no-package-lock --no-audit --no-fund

      - name: Run Node-only Z3 SMT proof-of-concept contracts
        run: npm --prefix experiments/z3-node test

      - name: Smoke-test Z3 CLI on explicit conflict fixture
        run: node experiments/z3-node/cli.mjs experiments/z3-node/fixtures/runtime-conflict.json

      - name: Measure experimental Z3 WASM startup and solver overhead
        run: npm --prefix experiments/z3-node run benchmark

      - name: JSON schema, accessibility, and trust gates
        run: npm run validate:schema

      - name: Performance benchmark
        run: npm run benchmark

      - name: V3 sampled-project memory benchmark
        run: npm run benchmark:v3-memory

      - name: Dependency security audit
        run: npm audit --omit=dev

      - name: UCE repository self-scan
        run: npm run security:self-scan

      - name: UCE pull request annotations
        if: github.event_name == 'pull_request'
        run: npm run uce:ci -- uce-self-scan.json --min-score=80 --max-critical=0 --max-warning=80 --annotations

      - name: UCE CI report gate
        run: npm run uce:ci -- testing/fixtures/phase5/ci-pass-report.json --min-score=80 --max-critical=0 --sarif=uce-ci-results.sarif

      - name: Upload UCE SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: uce-self-scan.sarif

      - name: Upload UCE reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uce-analysis-reports
          path: |
            uce-evidence-benchmark.json
            uce-accuracy-release.json
            uce-self-scan.json
            uce-self-scan.sarif
            uce-ci-results.sarif
            benchmark-output/evidence-evaluation.json
