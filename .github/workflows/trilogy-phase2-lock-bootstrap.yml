# Temporary, branch-restricted bootstrap for npm-resolved experimental lockfiles.
# Remove from this review branch after generated lockfiles have been committed.
name: Trilogy Phase 2 Lockfile Bootstrap
on:
  push:
    branches:
      - security/trilogy-phase2-20261022
    paths:
      - .github/workflows/trilogy-phase2-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'RyzovaTech/Ryzova-UCE-Original'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate dependency lockfiles without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix experiments/z3-node
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix experiments/datalog-z3
          test -s experiments/z3-node/package-lock.json
          test -s experiments/datalog-z3/package-lock.json
      - name: Verify clean lockfile installs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/z3-node
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/datalog-z3
      - name: Commit generated lockfiles to the restricted review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/z3-node/package-lock.json experiments/datalog-z3/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: lock isolated experimental dependencies with npm-generated integrity metadata'
          git push origin HEAD:security/trilogy-phase2-20261022
