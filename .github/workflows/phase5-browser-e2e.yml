name: Phase 5.5 Browser Interaction E2E

on:
  pull_request:
    paths:
      - 'src/components/reports/**'
      - 'src/lib/report/**'
      - 'testing/browser/**'
      - '.github/workflows/phase5-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-phase5:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Playwright in a separate temporary project
        run: |
          mkdir -p "$RUNNER_TEMP/uce-phase55-browser"
          npm install --prefix "$RUNNER_TEMP/uce-phase55-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          echo "UCE_PLAYWRIGHT_ENTRY=$RUNNER_TEMP/uce-phase55-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Install Chromium and Linux runtime libraries
        run: node "$RUNNER_TEMP/uce-phase55-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run real Phase 5.5 browser UI, privacy and stale-request assertions
        run: node testing/browser/phase5-e2e.mjs
