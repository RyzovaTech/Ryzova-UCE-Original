name: Phase 5.5 Browser Interaction E2E

on:
  pull_request:
    paths:
      - 'src/components/reports/**'
      - 'src/lib/report/**'
      - 'testing/browser/**'
      - '.github/workflows/phase5-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-phase5:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned isolated browser test runner without lockfile edits
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and Linux runtime libraries
        run: npx playwright install --with-deps chromium
      - name: Run real Phase 5.5 browser UI, privacy and stale-request assertions
        run: node testing/browser/phase5-e2e.mjs
