name: Souffle Datalog Z3 and cvc5 Experimental CI

on:
  push:
    branches: [experiment/uce-datalog-z3, experiment/uce-datalog-z3-cvc5, experiment/uce-trilogy-optional-solver, experiment/uce-trilogy-accuracy-validation]
  pull_request:
    paths:
      - 'experiments/datalog-z3/**'
      - '.github/workflows/datalog-z3-experiment.yml'
      - 'testing/trilogy/**'

permissions:
  contents: read

jobs:
  datalog-z3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install UCE and isolated solver dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix experiments/z3-node --no-audit --no-fund
          npm ci --prefix experiments/datalog-z3 --no-audit --no-fund
      - name: Install verified official Souffle 2.5 Ubuntu 24.04 package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          release=https://github.com/souffle-lang/souffle/releases/download/2.5
          asset=x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          curl -fLsS --retry 3 --max-time 100 "$release/$asset" -o "$asset"
          curl -fLsS --retry 3 --max-time 40 "$release/sha512sum.txt" -o upstream-sha512sum.txt
          grep -F "$asset" upstream-sha512sum.txt | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y "./$asset"
          souffle --version
      - name: Install pinned cvc5 1.1.2 from Ubuntu 24.04 universe
        timeout-minutes: 5
        run: |
          sudo apt-get install -y cvc5=1.1.2-1build1
          cvc5 --version
          cvc5 --version | grep -F '1.1.2'
      - name: Test actual Souffle dependency recursion and Z3 SMT proofs
        run: npm --prefix experiments/datalog-z3 test
      - name: Verify CLI source-linked conflict fixture
        run: npm --prefix experiments/datalog-z3 run demo
      - name: Measure three repeated Node-only solver samples
        run: npm --prefix experiments/datalog-z3 run benchmark
      - name: Test independent cvc5 SMT-LIB verification on identical Souffle-derived facts
        run: npm --prefix experiments/datalog-z3 run test:triple
      - name: Benchmark full Souffle plus Z3 plus native cvc5 confirmation
        run: npm --prefix experiments/datalog-z3 run benchmark:triple
      - name: Compare sampled process-tree memory, old versus serial verifiers
        run: npm --prefix experiments/datalog-z3 run benchmark:memory
      - name: Optional Trilogy integration into complete UCE reports
        run: npm --prefix experiments/datalog-z3 run test:optional
      - name: Verify explicit Trilogy opt-in and default-disabled CLI
        run: |
          npm --prefix experiments/datalog-z3 run demo:default
          npm --prefix experiments/datalog-z3 run demo:optional
      - name: Validate frozen holdout ground-truth certificates and metrics math
        run: npm --prefix experiments/datalog-z3 run test:holdout-metrics
      - name: Verify pinned real repository provenance, Phase 4 preflight, and blind human-review gate
        run: node --test testing/trilogy/real-repository-intake.test.mjs testing/trilogy/real-repository-preflight.test.mjs testing/trilogy/independent-review-gate.test.mjs
      - name: Measure Trilogy precision, recall, FP, FN, Unknown, and coverage
        run: npm --prefix experiments/datalog-z3 run audit:holdout
      - name: Publish versioned holdout metrics, even on validation failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uce-trilogy-holdout-metrics
          path: testing/trilogy/reports/latest-holdout.json
          if-no-files-found: warn
      - name: Prevent browser root dependency leakage
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); for (const n of ['z3-solver','cvc5','souffle']) if(p.dependencies?.[n] || p.devDependencies?.[n]) throw Error('Native solver leaked into browser dependencies');"

