name: Sync UCE Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UCE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to deployment mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror https://x-access-token:${MIRROR_TOKEN}@github.com/RyzovaTech/Ryzova-UCE-Mirror.git
          git push mirror main:main --force
