name: Sync UCE Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the workflow token capable of updating repository contents. The
# MIRROR_TOKEN secret must be a fine-grained token with Contents: Read and
# write access to RyzovaTech/Ryzova-UCE-Mirror.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UCE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to deployment mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          test -n "${MIRROR_TOKEN}"
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/RyzovaTech/Ryzova-UCE-Mirror.git" HEAD:refs/heads/main --force
